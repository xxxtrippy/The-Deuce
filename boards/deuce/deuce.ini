##################################### THE DEUCE #####################################
; Custom Bruce target for "The Deuce": classic ESP32-WROOM-32U + 2.4" ILI9341 (XPT2046
; touch), with SD + CC1101 + NRF24 on a second SPI bus, GPS, IR, and battery monitor.
; Every pin is baked into boards/deuce/pins_arduino.h (seeds Bruce's config defaults).
; NOTE: library handling mirrors the working Marauder-V4-V6 env (no lib_ldf_mode override)
;       so the framework resolves LittleFS -> FS correctly.

[env:Deuce]
board = esp32dev
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/deuce>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/deuce
	; ---- display + resistive touch (XPT2046 on the display's SPI bus) ----
	-DUSE_TFT_eSPI_TOUCH
	-DMARAUDER_TOUCH
	-DTFT_HEIGHT=320
	-DTFT_WIDTH=240
	-DTOUCH_XPT2046_SPI
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-DXPT2046_SPI_BUS_MISO_IO_NUM=19
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=23
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=18
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=21
	; ---- radios on the shared second bus (pins come from pins_arduino.h) ----
	-DUSE_CC1101_VIA_SPI
	-DUSE_NRF24_VIA_SPI
	; ---- IR + single-pin RF: default to your wiring (TX 25, RX 35) ----
	-DIR_TX_PINS='{{"IR LED 25", 25}}'
	-DIR_RX_PINS='{{"TSOP 35", 35}}'
	-DRF_TX_PINS='{{"RF TX 25", 25}}'
	-DRF_RX_PINS='{{"RF RX 35", 35}}'
	-DDEVICE_NAME='"The Deuce"'
lib_deps =
	${env.lib_deps}
lib_ignore =
	${env_4mb.lib_ignore}

[env:LAUNCHER_Deuce]
extends = env:Deuce
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:Deuce.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}
