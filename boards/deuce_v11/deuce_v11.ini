##################################### THE DEUCE v1.1 #####################################
; Separate build target for "The Deuce v1.1": identical hardware to v1.0, but with the
; new paged 2x2 touch main-menu grid (boards/deuce_v11/interface.cpp + the DEUCE_GRID_MENU
; hook in src/core/main_menu.cpp). This is its OWN env and OWN board folder, so building it
; never touches the v1.0 env (Deuce) or its compiled output in .pio/build/Deuce.
;
; Build/flash:   pio run -e Deuce_v1_1 -t upload
; Build output:  .pio/build/Deuce_v1_1/   (separate from .pio/build/Deuce)

[env:Deuce_v1_1]
board = esp32dev
board_build.partitions = custom_4Mb_deuce.csv   ; bigger LittleFS (768KB) -- see the CSV
build_src_filter = ${env.build_src_filter} +<../boards/deuce_v11>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}
	-Iboards/deuce_v11
	-DUSE_TFT_eSPI_TOUCH
	-DMARAUDER_TOUCH
	-DTFT_HEIGHT=320
	-DTFT_WIDTH=240
	-DTOUCH_XPT2046_SPI
	-DXPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-DXPT2046_SPI_BUS_MISO_IO_NUM=19
	-DXPT2046_SPI_BUS_MOSI_IO_NUM=23
	-DXPT2046_SPI_BUS_SCLK_IO_NUM=18
	-DXPT2046_SPI_CONFIG_CS_GPIO_NUM=21
	-DUSE_CC1101_VIA_SPI
	-DUSE_NRF24_VIA_SPI
	-DFM_SI4713              ; enable the FM transmitter menu (Si4713 over I2C @ 0x63)
	-DDEUCE_GRID_MENU        ; enables the new paged 2x2 touch main menu (v1.1 only)
	-DDEVICE_NAME='"The Deuce v1.1"'
lib_deps =
	${env.lib_deps}
lib_ignore =
	${env_4mb.lib_ignore}
