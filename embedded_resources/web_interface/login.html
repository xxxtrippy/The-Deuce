<body>
    <canvas id="deuce-rain"></canvas>
    <div class="deuce-logo"></div>
    <div class="dialog-background">
        <form action="/login" method="POST">
            <div class="dialog login">
                <div class="dialog-head">
                    Login
                </div>
                <div class="dialog-body">
                    <div id="notice" style="display: none;font-weight: bold;padding-bottom: 5px;"></div>
                    <label for="username" class="oinput-label">Username</label>
                    <input type="text" name="username" id="username" class="oinput-text-submit"
                        style="margin-bottom: 10px">
                    <label for="password" class="oinput-label">Password</label>
                    <input type="password" name="password" class="oinput-text-submit">
                </div>
                <div class="dialog-footer">
                    <input type="submit" class="btn-action" value="Login">
                </div>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('username').focus();

        const params = new URLSearchParams(location.search);
        const notice = document.getElementById('notice');
        if (params.has('failed')) notice.style.display = 'block', notice.textContent = 'Login Failed - Please try again.';
        else if (params.has('loggedout')) notice.style.display = 'block', notice.textContent = 'You have been logged out successfully.';
    </script>
    <script>
      (function () {
        var c = document.getElementById('deuce-rain'); if (!c) return;
        var x = c.getContext('2d');
        var cs = getComputedStyle(document.documentElement);
        function col(n, f) { var v = cs.getPropertyValue(n).trim(); return v || f; }
        var SEC = col('--sec-color', '#00ff66'), BG = col('--background', '#111111');
        var fs = 14, cols, drops;
        function resize() { c.width = window.innerWidth; c.height = window.innerHeight; cols = Math.ceil(c.width / fs); drops = []; for (var i = 0; i < cols; i++) drops[i] = Math.random() * c.height / fs; x.fillStyle = BG; x.fillRect(0, 0, c.width, c.height); }
        var CH = "0123456789ABCDEFGHJKLMNPRSTUVWXYZ#$%&*+=<>";
        function draw() { x.globalAlpha = 0.08; x.fillStyle = BG; x.fillRect(0, 0, c.width, c.height); x.globalAlpha = 1; x.fillStyle = SEC; x.font = fs + "px monospace"; for (var i = 0; i < cols; i++) { var ch = CH[Math.floor(Math.random() * CH.length)]; x.fillText(ch, i * fs, drops[i] * fs); if (drops[i] * fs > c.height && Math.random() > 0.975) drops[i] = 0; drops[i] += 0.5; } }
        window.addEventListener('resize', resize); resize(); setInterval(draw, 60);
      })();
    </script>
  </body>
