name: Deuce CI

concurrency:
  group: deuce-ci-${{ github.ref }}
  cancel-in-progress: true

# Pages deploy of the web flasher needs these.
permissions:
  contents: read
  pages: write
  id-token: write

# Compiles ONLY the Deuce_v1_1 env on GitHub's runners (which have the ESP32 toolchain),
# so every push is verified to build before anything is flashed. Based on Bruce's own
# manual_build_sel_env.yml recipe.

on:
  push:
    paths:
      - "**.h"
      - "**.cpp"
      - "**.ino"
      - "**.ini"
      - "**.py"
      - "**.csv"
      - "**.json"
      - "**.html"
      - "**.css"
      - "**.js"
      - ".github/workflows/deuce_ci.yml"
  workflow_dispatch:

jobs:
  build-deuce:
    name: Build Deuce_v1_1
    runs-on: ubuntu-latest
    env:
      SELECTED_ENV: Deuce_v1_1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache PlatformIO core + toolchain
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Cache library deps
        uses: actions/cache@v4
        with:
          path: .pio/libdeps
          key: ${{ runner.os }}-libdeps-${{ env.SELECTED_ENV }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-libdeps-${{ env.SELECTED_ENV }}-

      - name: Install dependencies
        run: |
          pip install requests esptool intelhex
          pip install -U platformio

      - name: Inject BRUCE_VERSION (same as Bruce CI)
        run: |
          version="${GITHUB_SHA::7}"
          sed -i "s/-DBRUCE_VERSION=/-DBRUCE_VERSION='\"$version\"' ; /g" ./platformio.ini || true

      - name: Compile Deuce_v1_1
        run: |
          set -o pipefail
          platformio run -e "$SELECTED_ENV" 2>&1 | tee build.log

      - name: Report flash/RAM usage (always)
        if: always()
        run: |
          # PlatformIO prints "RAM:   [..] N% (used X from Y)" and same for Flash.
          # Surface them as notices so the app-partition / RAM headroom is visible
          # from the run's annotations after every build.
          grep -E "^(RAM|Flash):" build.log 2>/dev/null | while IFS= read -r l; do echo "::notice::$l"; done || true

      - name: Show build tail (always)
        if: always()
        run: |
          echo "----- last 150 lines -----"
          tail -n 150 build.log 2>/dev/null || echo "no build.log"

      - name: Surface build tail as annotations (on failure)
        if: failure()
        run: |
          tail -n 40 build.log 2>/dev/null | while IFS= read -r l; do echo "::error::$l"; done || echo "::error::no build.log produced"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Deuce_v1_1-firmware
          path: |
            .pio/build/Deuce_v1_1/firmware.bin
            .pio/build/Deuce_v1_1/bootloader.bin
            .pio/build/Deuce_v1_1/partitions.bin
            .pio/build/Deuce_v1_1/firmware.elf
            Bruce-Deuce_v1_1.bin
          if-no-files-found: warn
          retention-days: 3

      # ---- Web flasher: assemble the Pages site (esp-web-tools) on main ----
      - name: Assemble flasher site
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/manifest.json _site/manifest.json
          cp .pio/build/Deuce_v1_1/bootloader.bin _site/bootloader.bin
          cp .pio/build/Deuce_v1_1/partitions.bin _site/partitions.bin
          cp .pio/build/Deuce_v1_1/firmware.bin _site/firmware.bin
          ver="${GITHUB_SHA::7}"
          sed -i "s/{{VERSION}}/$ver/g" _site/manifest.json _site/index.html
          echo "Flasher site assembled for build $ver"

      - name: Upload Pages artifact
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-flasher:
    name: Deploy web flasher (Pages)
    if: github.ref == 'refs/heads/main'
    needs: build-deuce
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
